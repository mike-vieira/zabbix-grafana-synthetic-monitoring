zabbix_export:
  version: '6.4'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 7a225d01ca47490a86aeaa48eafdd00d
    template: MikroTik Dashboard Overlay
    name: MikroTik | Dashboard Overlay
    description: 'Template overlay público para MikroTik RouterOS via SNMPv2/SNMPv3. Projetado para ser vinculado adicionalmente a hosts que já possuam outro template, usando chaves próprias (mk.overlay.*). Não cria triggers; foco em dashboard e troubleshooting N1/N2. Requer interface SNMP no host. Compatível com RouterOS que exponha HOST-RESOURCES-MIB e IF-MIB. Dashboard v8: cockpit (KPIs semânticos, conectividade, recursos), Interfaces (RX/TX combinados + estado) e Qualidade (erros/descartes por interface).'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 7af38d79631c4ac99d61e9a5eeb799a6
      name: 'MikroTik: CPU load'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.3.1.2.1
      key: mk.overlay.cpu.util
      history: 7d
      trends: 30d
      units: '%'
    - uuid: b0671aa8f8b74a46ba029a36b6b878b2
      name: 'MikroTik: Memory total'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.2.3.1.5.65536
      key: mk.overlay.memory.total
      history: 7d
      trends: 30d
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
    - uuid: 377245e3d4bb457a94a9c7e21979ce79
      name: 'MikroTik: Memory used'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.2.3.1.6.65536
      key: mk.overlay.memory.used
      history: 7d
      trends: 30d
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
    - uuid: d6f8f78e415d47dfbe3802324ecccd96
      name: 'MikroTik: Memory utilization'
      type: CALCULATED
      key: mk.overlay.memory.pct
      history: 7d
      trends: 30d
      value_type: FLOAT
      units: '%'
      params: last(//mk.overlay.memory.used)/last(//mk.overlay.memory.total)*100
      description: Percentual de memória em uso (used/total). Calculado a partir dos itens SNMP existentes.
    - uuid: 4a9be9d0b6a1422799c6230bb9765606
      name: 'MikroTik: System description'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: mk.overlay.system.descr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
    - uuid: ec0e8116380d4843ae9dd5d9c0ec1b89
      name: 'MikroTik: System name'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: mk.overlay.system.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
    - uuid: ff2b9b4541bc4e058242b9d1b2d261b3
      name: 'MikroTik: Uptime'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: mk.overlay.system.uptime
      history: 7d
      trends: 30d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
    - uuid: 96057e740f534759820db77c4c620194
      name: 'MikroTik: ICMP packet loss'
      type: SIMPLE
      key: icmppingloss[{HOST.CONN},5,20,56,1000]
      history: 7d
      trends: 30d
      value_type: FLOAT
      units: '%'
    - uuid: 6be5fa332e664972b232d8ae6ce1cc1e
      name: 'MikroTik: ICMP latency'
      type: SIMPLE
      key: icmppingsec[{HOST.CONN},5,20,56,1000,avg]
      history: 7d
      trends: 30d
      value_type: FLOAT
      units: s
    - uuid: 2b793d249d66460baf797e4320b3c351
      name: 'MikroTik: CPE ICMP status'
      type: SIMPLE
      key: icmpping[{HOST.CONN},5,20,56,1000]
      history: 7d
      trends: 30d
      valuemap:
        name: MikroTik Overlay Availability
    discovery_rules:
    - uuid: 7c44c0017bb3406d962d964fd40d21fe
      name: 'MikroTik: Interface discovery'
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: mk.overlay.net.if.discovery
      delay: 1h
      lifetime: 7d
      item_prototypes:
      - uuid: 361e85582ae842258d0fe19fce50b1a5
        name: 'MikroTik Interface {#IFNAME}: Discards RX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: mk.overlay.net.if.in.discards[{#SNMPINDEX}]
        history: 7d
        trends: 30d
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: afb00a5b40b541928f1a621ef02c86cf
        name: 'MikroTik Interface {#IFNAME}: Errors RX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: mk.overlay.net.if.in.errors[{#SNMPINDEX}]
        history: 7d
        trends: 30d
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: 4285623353dd40c287de310b22c6bbcb
        name: 'MikroTik Interface {#IFNAME}: RX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: mk.overlay.net.if.in[{#SNMPINDEX}]
        history: 7d
        trends: 30d
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 25ba60016d8c43dd8095f990debde14a
        name: 'MikroTik Interface {#IFNAME}: Discards TX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: mk.overlay.net.if.out.discards[{#SNMPINDEX}]
        history: 7d
        trends: 30d
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: eab079ae097e4350a471abb271abc998
        name: 'MikroTik Interface {#IFNAME}: Errors TX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: mk.overlay.net.if.out.errors[{#SNMPINDEX}]
        history: 7d
        trends: 30d
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: 6c7970f90390420d88090e143cebf9b0
        name: 'MikroTik Interface {#IFNAME}: TX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: mk.overlay.net.if.out[{#SNMPINDEX}]
        history: 7d
        trends: 30d
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 9aa1352d10e94c6b88825224a3a7a9ef
        name: 'MikroTik Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: mk.overlay.net.if.status[{#SNMPINDEX}]
        history: 7d
        trends: 30d
      graph_prototypes:
      - uuid: a505d705b647421e9ebc9191f4908844
        name: 'MikroTik Interface {#IFNAME}: Traffic'
        show_work_period: 'NO'
        show_triggers: 'NO'
        ymin_type_1: FIXED
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 42A5F5
          item:
            host: MikroTik Dashboard Overlay
            key: mk.overlay.net.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: 80CBC4
          item:
            host: MikroTik Dashboard Overlay
            key: mk.overlay.net.if.out[{#SNMPINDEX}]
        show_legend: 'YES'
      - uuid: 912fddcfac7246a39835dffec1dfcf1d
        name: 'MikroTik Interface {#IFNAME}: Status'
        show_work_period: 'NO'
        show_triggers: 'NO'
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        yaxismax: '3'
        graph_items:
        - drawtype: BOLD_LINE
          color: 90A4AE
          item:
            host: MikroTik Dashboard Overlay
            key: mk.overlay.net.if.status[{#SNMPINDEX}]
        show_legend: 'YES'
      - uuid: 6563b31763ee409a80cacd4c3571c531
        name: 'MikroTik Interface {#IFNAME}: Errors'
        show_work_period: 'NO'
        show_triggers: 'NO'
